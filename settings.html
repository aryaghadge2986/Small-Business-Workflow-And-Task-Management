<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BizFlow - Settings</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">B</div>

            <div>
                <h1>BizFlow</h1>
                <p>Smart Workflow</p>
            </div>

        </div>

        <p class="menu-title">MAIN MENU</p>

        <nav>

            <a href="index.html" class="nav-btn">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="tasks.html" class="nav-btn">
                📋
                <span>Tasks</span>
            </a>

            <a href="create-tasks.html" class="nav-btn">
                ➕
                <span>Create Task</span>
            </a>

            <a href="settings.html" class="nav-btn active">
                ⚙️
                <span>Settings</span>
            </a>

        </nav>

        <div class="sidebar-info">

            <div>🚀</div>

            <h3>Work smarter</h3>

            <p>
                Manage tasks and collaborate
                with your team.
            </p>

        </div>

        <div class="user">

            <div class="avatar">A</div>

            <div>
                <strong>Arya</strong>
                <small>Admin</small>
            </div>

        </div>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main">

        <section class="page active-page">

            <header class="top-header">

                <div>

                    <span class="label">
                        ACCOUNT
                    </span>

                    <h2>
                        Settings ⚙️
                    </h2>

                    <p>
                        Manage your account and preferences.
                    </p>

                </div>

            </header>


            <!-- PROFILE -->

            <div class="overview-card">

                <span class="label">
                    PROFILE
                </span>

                <h3>
                    User Information
                </h3>

                <div class="settings-form">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        value="Arya"
                    >


                    <label>
                        Role
                    </label>

                    <input
                        type="text"
                        value="Admin"
                    >


                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                    >

                </div>

                <button class="primary-btn">
                    Save Changes
                </button>

            </div>


            <!-- PREFERENCES -->

            <div class="overview-card">

                <span class="label">
                    PREFERENCES
                </span>

                <h3>
                    Notifications
                </h3>

                <label class="setting-option">

                    <input type="checkbox" checked>

                    <span>
                        Receive task notifications
                    </span>

                </label>


                <label class="setting-option">

                    <input type="checkbox" checked>

                    <span>
                        Receive workflow updates
                    </span>

                </label>

            </div>

        </section>

    </main>

</div>

</body>

</html>
